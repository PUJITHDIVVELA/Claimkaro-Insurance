{% extends 'base.html' %}

{% block title %}Sign In - ClaimKaro Insurance Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-table p-4 shadow-lg border-0">
                <div class="text-center mb-4">
                    <i class="fas fa-shield-alt text-primary fs-1 mb-2"></i>
                    <h3 class="fw-bold">Sign In to ClaimKaro</h3>
                    <p class="text-muted small">Enter your credentials to access your dashboard</p>
                </div>

                <form action="{{ url_for('auth.login_view') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label font-weight-bold mb-0">Password</label>
                            <a href="{{ url_for('auth.forgot_password_view') }}" class="small text-primary text-decoration-none font-weight-bold">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3 shadow-sm">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </form>

                <div class="text-center">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('auth.register_view') }}" class="text-primary font-weight-bold">Register as Customer</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
